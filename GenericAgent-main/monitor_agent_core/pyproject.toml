[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longcontext-monitor"
version = "0.1.0"
description = "Independent persistent task supervision agent"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "shortuuid>=1.0"]

[tool.setuptools]
packages = ["monitor_agent_core", "monitor_agent_core.vendor", "monitor_agent_core.vendor.pma_memory"]
package-dir = {monitor_agent_core = ".", "monitor_agent_core.vendor" = "vendor", "monitor_agent_core.vendor.pma_memory" = "vendor/pma_memory"}
include-package-data = false

[tool.setuptools.package-data]
monitor_agent_core = ["vendor/*.md", "vendor/*LICENSE*", "vendor/*NOTICE*"]
